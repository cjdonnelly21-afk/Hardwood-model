name: lines

# Sportsbook lines -> EV, run on GitHub's servers so it never depends on the Mac being awake.
# Times are Eastern (UTC-5): about 8am, 12:30pm and 5pm.  Each pull is 3 of the 500 free monthly credits.
on:
  schedule:
    - cron: "7 13 * * *"
    - cron: "37 17 * * *"
    - cron: "11 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lines
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Pull lines, compute EV, publish (a retry re-uses the same pull instead of spending credits again)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_CACHE: ${{ runner.temp }}/odds.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            python src/lines_only.py
            git add data docs
            git diff --cached --quiet && exit 0
            git commit -qm "Lines update $(date -u +%Y-%m-%d\ %H:%M)"
            git push -q && exit 0
            git reset -q --hard origin/main 2>/dev/null; git fetch -q origin main; git reset -q --hard origin/main
            sleep 5
          done
          exit 1
