name: daily-update

on:
  schedule:
    - cron: "17 10 * * *"   # ~5-6am Eastern: grade last night, predict today
    - cron: "47 18 * * *"   # ~2-3pm Eastern: refresh ratings before tonight's tip-offs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh data, relearn, predict
        run: python src/update.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d\ %H:%M)"
          git push
