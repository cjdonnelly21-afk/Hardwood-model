name: daily-update

on:
  schedule:
    - cron: "17 15 * * *"   # ~10:17am Eastern (UTC-5): grade last night, predict today (Mac is awake, not asleep at 6am)
    - cron: "47 18 * * *"   # ~1:47pm Eastern: refresh ratings and lines before tonight's tip-offs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    # Torvik blocks GitHub's cloud servers (HTTP 403), so this runs on CJ's own computer.
    # If the computer is asleep, GitHub holds the job and runs it when the runner comes back online.
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Refresh data, relearn, predict
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: .venv/bin/python src/update.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d\ %H:%M)"
          git push
