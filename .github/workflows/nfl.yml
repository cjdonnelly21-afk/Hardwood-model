name: nfl-picks

on:
  schedule:
    - cron: "17 15 * * 4"   # Thursday ~10:17am Eastern (UTC-5): lines for Thursday night's game
    - cron: "17 15 * * 6"   # Saturday ~10:17am Eastern: lines for the Sunday / Monday slate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-picks
  cancel-in-progress: false

jobs:
  nfl:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: NFL ratings, backtest, lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: .venv/bin/python src/nfl.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "NFL update $(date -u +%Y-%m-%d\ %H:%M)"
          git pull --rebase -q || true
          git push
